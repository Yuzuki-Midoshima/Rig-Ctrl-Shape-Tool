name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: rig_ctrl_shape_tool

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run pure Python domain tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest rig_ctrl_shape_tool/tests/test_domain.py
